<div data-turn-key="UUID">
 <div data-content-search-turn-key="fallback-turn-0"><div data-talvt-turn-state="complete">
  <h4 class="sr-only">You said:</h4>
  <div class="group/user-message" data-chatgpt-search-unit-key="fallback-turn-0:0:user">
    <div data-user-message-bubble="true"><div dir="auto">USER TEXT</div></div>
    <button aria-label="Copy message"/><button aria-label="Edit message"/>
  </div>
  <span hidden data-chatgpt-agent-turn-start></span>
  <div data-chatgpt-search-unit-key="fallback-turn-0:1:assistant">
    <h4 class="sr-only" data-conversation-role="assistant">ChatGPT said:</h4>
    <div data-chatgpt-selection-message-id="MSGID">
     <div dir="auto" data-markdown-text-style="assistant-message"><div data-dil-source-message-id="MSGID" data-markdown-copy="contents">
       <div data-d-inline-reveal dir="auto"><p data-d-text-flow data-d-component="text"><span data-d-text-flow="word" data-d-stream-word>word </span>...</p></div>
     </div></div></div>
    <div><button aria-label="Copy"/><button aria-label="Rate response"/><button aria-label="Read aloud"/><button aria-label="Share"/><button aria-label="Regenerate response"/><button aria-label="More actions"/></div>
  </div>
 </div></div>
</div>
<form data-composer-placement="thread" data-chatgpt-composer data-thread-find-composer="true">
  <div contenteditable="true" role="textbox" aria-multiline="true" aria-label="Ask ChatGPT" class="ProseMirror" data-composer-markdown data-virtualkeyboard="true"><p data-empty-paragraph="true" data-placeholder="Ask ChatGPT"><br></p></div>
  <button aria-label="Dictate"/><button aria-label="Start Voice"/>  <!-- idle state, empty composer; send button appears only when text typed -->
</form>
