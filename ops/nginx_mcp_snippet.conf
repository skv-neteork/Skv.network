# Insert inside the HTTPS server_name skv.network { ... } block (before location /).
# Or apply via: /root/skv-core/ops/install_mcp_nginx.sh
#
# Public MCP (prefix stripped → upstream paths /, /sse, /messages/, /health):
#   https://skv.network/mcp       → Streamable HTTP (Cursor / Claude remote)
#   https://skv.network/mcp/sse   → SSE (legacy / clients that want SSE)
#   https://skv.network/mcp/messages/...  → SSE POST channel
#   https://skv.network/mcp/health → liveness (no auth)

# Exact /mcp (no trailing slash) — Cursor often uses this URL for streamable HTTP
location = /mcp {
    proxy_pass http://skv_mcp_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location ^~ /mcp/ {
    proxy_pass http://skv_mcp_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-API-Key $http_x_api_key;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
