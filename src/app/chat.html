<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKV Chat v6.0 — Guardian SDK + Memory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #0d1117; color: #c9d1d9; }
        .nav { display: flex; gap: 24px; padding: 16px 24px; border-bottom: 1px solid #21262d; }
        .nav a { color: #8b949e; text-decoration: none; font-size: 14px; }
        .nav a:hover { color: #c9d1d9; }
        .nav a.active { color: #f78166; }
        .main { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #f0883e; font-size: 24px; margin-bottom: 8px; }
        .memory-status { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
        .memory-status span { color: #3fb950; }
        .chat-box { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 20px; min-height: 400px; max-height: 600px; overflow-y: auto; margin-bottom: 16px; }
        .msg { margin-bottom: 16px; padding: 12px; border-radius: 8px; }
        .msg.user { background: #1f6feb22; border: 1px solid #1f6feb44; }
        .msg.agent { background: #23863622; border: 1px solid #23863644; }
        .msg .role { font-size: 12px; color: #8b949e; margin-bottom: 4px; }
        .msg .text { font-size: 15px; line-height: 1.5; }
        .msg .seal { font-size: 12px; color: #f0883e; margin-top: 8px; font-family: monospace; }
        .msg .cubes { font-size: 12px; color: #8b949e; margin-top: 4px; }
        .input-area { display: flex; gap: 8px; }
        .input-area input { flex: 1; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 15px; }
        .input-area button { padding: 12px 24px; background: #238636; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .input-area button:hover { background: #2ea043; }
        .loading { text-align: center; color: #8b949e; padding: 20px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/chat" class="active">💬 Chat</a>
        <a href="/guide">Guide</a>
        <a href="/about">About</a>
    </div>
    <div class="main">
        <h1>SKV Chat v6.0</h1>
        <div class="memory-status">🧠 Memory: <span id="memoryStatus">active (session saved)</span> | API Key: <span id="apiKeyStatus">not set</span></div>
        <div class="chat-box" id="chatBox">
            <div class="msg agent">
                <div class="role">🤖 SKV Agent (v6.0)</div>
                <div class="text">Hello! I'm connected to SKV Network with persistent memory. Every response is verified through CUBE 00 and saved to your project. Ask me anything!</div>
                <div class="seal">🔐 SKV | #0 | CUBE 00 active</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="queryInput" placeholder="Ask SKV Agent..." onkeydown="if(event.key==='Enter')sendQuery()">
            <button onclick="sendQuery()">Send</button>
        </div>
    </div>

    <script>
        // Постоянный user_id для памяти (можно заменить на email после логина)
        let USER_ID = localStorage.getItem('skv_chat_uid');
if (!USER_ID) {
    USER_ID = 'chat_user_' + Date.now();
    localStorage.setItem('skv_chat_uid', USER_ID);
}
        const PROJECT = 'skv-chat';
        const API_KEY = localStorage.getItem('skv_token') || '';
        
        if (API_KEY) {
            document.getElementById('apiKeyStatus').textContent = '✓ set';
            document.getElementById('apiKeyStatus').style.color = '#3fb950';
        }
        
        let sealCounter = 0;
        let sessionCounter = 1;
        
        async function sendQuery() {
            const input = document.getElementById('queryInput');
            const query = input.value.trim();
            if (!query) return;
            
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg user">
                <div class="role">👤 You</div>
                <div class="text">${escapeHtml(query)}</div>
            </div>`;
            chatBox.innerHTML += '<div class="loading">⏳ Thinking...</div>';
            chatBox.scrollTop = chatBox.scrollHeight;
            input.value = '';
            
            try {
                // 1. Запрос к Consult API
                const response = await fetch('/api/consult', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        query: query,
                        model: 'deepseek',
                        user_id: USER_ID
                    })
                });
                
                const data = await response.json();
                document.querySelector('.loading')?.remove();
                
                const answer = data.answer || 'No answer received';
                const cubes = data.used_cubes || [];
                sealCounter++;
                
                let cubesHtml = '';
                if (cubes.length > 0) {
                    cubesHtml = `<div class="cubes">📚 Used cubes: ${cubes.length}</div>`;
                }
                
                chatBox.innerHTML += `<div class="msg agent">
                    <div class="role">🤖 SKV Agent</div>
                    <div class="text">${escapeHtml(answer)}</div>
                    ${cubesHtml}
                    <div class="seal">🔐 SKV | #${sealCounter} | CUBE 00 active</div>
                </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // 2. Сохраняем сессию в память (асинхронно, не ждём)
                const sessionId = 's' + sessionCounter++;
                fetch('/api/v4/sessions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify({
                        user_id: USER_ID,
                        project: PROJECT,
                        session_id: sessionId,
                        query: query,
                        response: answer
                    })
                }).then(r => r.json()).then(d => {
                    if (d.status === 'saved') {
                        document.getElementById('memoryStatus').innerHTML = '🧠 Memory: <span>active (session ' + sessionId + ' saved)</span>';
                    }
                }).catch(() => {});
                
            } catch (e) {
                document.querySelector('.loading')?.remove();
                chatBox.innerHTML += `<div class="msg agent">
                    <div class="role">🤖 SKV Agent</div>
                    <div class="text">Error: ${escapeHtml(e.message)}</div>
                </div>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
