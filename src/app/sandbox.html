<!DOCTYPE html>
<html>
<head><title>SKV Code Sandbox</title>
<style>
body{background:#0d1117;color:#c9d1d9;font-family:monospace;padding:20px;max-width:800px;margin:0 auto}
textarea{width:100%;height:200px;background:#161b22;color:#58a6ff;border:1px solid #30363d;padding:10px;font-size:14px;resize:vertical;border-radius:6px}
button{padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;border:none;color:#fff}
.btn-run{background:#238636}
.btn-copy{background:#30363d}
.btn-clear{background:#da3633}
#output{background:#161b22;border:1px solid #30363d;padding:15px;margin-top:15px;white-space:pre-wrap;min-height:100px;font-size:13px;border-radius:6px;user-select:all}
h1{color:#f0883e;font-size:24px}
</style></head>
<body>
<div style="display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap">
<a href="/" style="color:#8b949e;text-decoration:none">Home</a>
<a href="/upload" style="color:#8b949e;text-decoration:none">Upload</a>
<a href="/trials" style="color:#8b949e;text-decoration:none">Trials</a>
<a href="/evolver" style="color:#8b949e;text-decoration:none">Evolver</a>
<a href="/sandbox" style="color:#f0883e;text-decoration:none">Sandbox</a>
<a href="/chat" style="color:#8b949e;text-decoration:none">Chat</a>
<a href="/guide" style="color:#8b949e;text-decoration:none">Guide</a>
<a href="/about" style="color:#8b949e;text-decoration:none">About</a>
</div>
<h1>SKV Code Sandbox</h1>
<textarea id="code" placeholder="# Write your Python code here...
# Examples:
#   print(2+2)
#   def fib(n): return n if n <= 1 else fib(n-1) + fib(n-2)
#   print(fib(10))
"></textarea>
<div style="display:flex;gap:10px;margin:10px 0">
<button class="btn-run" onclick="run()">Run</button>
<button class="btn-clear" onclick="clearAll()">Clear</button>
</div>
<div id="output"></div>
<script>
function run() {
    const code = document.getElementById("code").value;
    if (!code.trim()) { document.getElementById("output").textContent = "Please enter some code."; return; }
    document.getElementById("output").textContent = "Running...";
    fetch("/api/execute/code", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:code, mode:"all", language:"python"})
    })
    .then(r => r.json())
    .then(d => {
        let out = "Status: " + d.status + "\nOutput: " + (d.stdout || "none") + "\nIterations: " + d.iterations;
        if (d.fixes_applied && d.fixes_applied.length) {
            out += "\n\nFixes:";
            d.fixes_applied.forEach(function(f) { out += "\n  #" + f.attempt + ": " + f.fix; });
        }
        if (d.metrics) {
            out += "\n\nMetrics: score=" + (d.metrics.score || "N/A") + ", complexity=" + d.metrics.complexity + ", error_handling=" + d.metrics.has_error_handling;
        }
        document.getElementById("output").textContent = out;
    })
    .catch(function(e) { document.getElementById("output").textContent = "Error: " + e.message; });
}
function clearAll() {
    document.getElementById("code").value = "";
    document.getElementById("output").textContent = "";
}
</script>
</body>
</html>
