<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKV Network — Code Sandbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0B0F19;
            color: #d1d5db;
            min-height: 100vh;
        }
        header {
            border-bottom: 1px solid #1f2937;
            background: rgba(17, 24, 39, 0.5);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
            height: 56px;
        }
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { font-size: 18px; font-weight: 700; color: white; text-decoration: none; }
        .logo-version { color: #10b981; }
        nav { display: flex; gap: 20px; }
        nav a { color: #9ca3af; text-decoration: none; font-size: 13px; }
        nav a:hover { color: #10b981; }
        nav a.active { color: #10b981; }
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .page-title { font-size: 32px; font-weight: 800; color: white; margin-bottom: 8px; }
        .card {
            background: rgba(17, 24, 39, 0.4);
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .CodeMirror {
            height: 400px;
            border: 1px solid #374151;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }
        .CodeMirror-focused { border-color: #10b981; }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-run { background: #10b981; color: white; flex: 1; }
        .btn-run:disabled { background: #374151; cursor: not-allowed; }
        .btn-clear { background: transparent; color: #f87171; border: 1px solid #7f1d1d; }
        .btn-example {
            background: transparent;
            color: #a78bfa;
            border: 1px solid #374151;
            font-size: 12px;
            padding: 6px 12px;
        }
        #output {
            background: #0B0F19;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 16px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #d1d5db;
            white-space: pre-wrap;
        }
        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .status-success { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; }
        .status-error { background: rgba(239, 68, 68, 0.1); color: #fca5a5; }
        .history-item {
            background: #0B0F19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 11px;
        }
        .history-item:hover { border-color: #374151; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo">�� SKV_NETWORK <span class="logo-version">v8.3</span></a>
            <nav>
                <a href="/">Home</a>
                <a href="/sandbox" class="active">Sandbox</a>
                <a href="/profile">Profile</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="page-title">Code Sandbox</h1>
        <p style="color: #9ca3af; margin-bottom: 32px;">Execute Python code with AI auto-fix. <strong style="color: #a78bfa;">Ctrl+Enter to run.</strong></p>

        <div class="card">
            <div id="editor"></div>
            <div style="display: flex; gap: 10px; margin-top: 16px;">
                <button class="btn btn-run" onclick="run()" id="btn-run">▶ Run Code (Ctrl+Enter)</button>
                <button class="btn btn-clear" onclick="clearAll()">✕ Clear</button>
                <label class="btn btn-example" style="cursor: pointer;">
                    �� Import
                    <input type="file" accept=".py,.txt" onchange="importFile(event)" style="display: none;">
                </label>
                <button class="btn btn-example" onclick="exportCode()">�� Export</button>
            </div>
        </div>

        <div class="card" id="output-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-weight: 600;">Output</span>
                <span class="status-badge" id="status-badge"></span>
            </div>
            <div id="output"></div>
        </div>

        <div class="card">
            <button class="btn btn-example" onclick="loadExample('hello')">Hello World</button>
            <button class="btn btn-example" onclick="loadExample('fibonacci')">Fibonacci</button>
            <button class="btn btn-example" onclick="loadExample('math')">Math</button>
            <button class="btn btn-example" onclick="loadExample('error')">Error Test</button>
        </div>
    </main>

    <script>
        const examples = {
            hello: 'print("Hello, SKV Network!")',
            fibonacci: `def fib(n):
    return n if n <= 1 else fib(n-1) + fib(n-2)
for i in range(10):
    print(f'fib({i}) = {fib(i)}')`,
            math: `import math
print(f'Pi: {math.pi:.4f}')
print(f'Sqrt(16): {math.sqrt(16)}')`,
            error: `print(1/0)`
        };

        const editor = CodeMirror(document.getElementById('editor'), {
            value: '# Write your Python code here...\nprint("Hello, SKV Network!")',
            mode: 'python',
            theme: 'dracula',
            lineNumbers: true,
            matchBrackets: true,
            autoCloseBrackets: true,
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true,
            extraKeys: {
                'Ctrl-Enter': () => run(),
                'Cmd-Enter': () => run(),
                'Ctrl-/': 'toggleComment',
                'Cmd-/': 'toggleComment',
                'Tab': (cm) => {
                    if (cm.somethingSelected()) {
                        cm.indentSelection('add');
                    } else {
                        cm.replaceSelection('    ', 'end');
                    }
                },
                'Shift-Tab': (cm) => { cm.indentSelection('subtract'); }
            }
        });

        function loadExample(name) {
            editor.setValue(examples[name]);
            document.getElementById('output-card').style.display = 'none';
        }

        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => editor.setValue(e.target.result);
            reader.readAsText(file);
        }

        function exportCode() {
            const blob = new Blob([editor.getValue()], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'code.py';
            a.click();
        }

        function run() {
            const code = editor.getValue();
            if (!code.trim()) return;

            const btn = document.getElementById('btn-run');
            btn.disabled = true;
            btn.textContent = '⏳ Running...';

            const badge = document.getElementById('status-badge');
            badge.className = 'status-badge';
            badge.textContent = 'Running...';

            fetch('/api/execute/code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code, mode: 'all', language: 'python' })
            })
            .then(r => r.json())
            .then(d => {
                document.getElementById('output-card').style.display = 'block';
                let output = '';
                
                if (d.status === 'success') {
                    badge.className = 'status-badge status-success';
                    badge.textContent = '✅ Success';
                    output = d.stdout || '(no output)';
                } else {
                    badge.className = 'status-badge status-error';
                    badge.textContent = '❌ Error';
                    output = d.stderr || d.status || 'Unknown error';
                }

                if (d.metrics) {
                    output += `\n\n--- Metrics ---`;
                    output += `\nTime: ${d.metrics.execution_time_ms}ms`;
                    output += `\nComplexity: ${d.metrics.complexity}`;
                }

                document.getElementById('output').textContent = output;
            })
            .catch(e => {
                document.getElementById('output-card').style.display = 'block';
                badge.className = 'status-badge status-error';
                badge.textContent = '❌ Error';
                document.getElementById('output').textContent = 'Error: ' + e.message;
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = '▶ Run Code (Ctrl+Enter)';
            });
        }

        function clearAll() {
            editor.setValue('');
            document.getElementById('output-card').style.display = 'none';
        }
    </script>
</body>
</html>
