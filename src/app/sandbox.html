<!DOCTYPE html>
<html>
<head><title>SKV Code Sandbox</title>
<style>
body{background:#0d1117;color:#c9d1d9;font-family:monospace;padding:20px;max-width:800px;margin:0 auto}
textarea{width:100%;height:200px;background:#161b22;color:#58a6ff;border:1px solid #30363d;padding:10px;font-size:14px;resize:vertical}
button{padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px;border:none;color:#fff}
.btn-run{background:#238636}
.btn-copy{background:#30363d}
.btn-clear{background:#da3633}
#output{background:#161b22;border:1px solid #30363d;padding:15px;margin-top:15px;white-space:pre-wrap;min-height:100px;font-size:13px}
h1{color:#f0883e;font-size:24px}
</style></head>
<body>
<h1>🧪 SKV Code Sandbox</h1>
<textarea id="code" placeholder="# Write your Python code here...
# Examples:
#   print(2+2)
#   def fib(n): return n if n <= 1 else fib(n-1) + fib(n-2)
#   print(fib(10))
"></textarea>
<div style="display:flex;gap:10px;margin:10px 0">
<button class="btn-run" onclick="run()">▶ Run</button>
<button class="btn-copy" onclick="copyCode()">📋 Copy Code</button>
<button class="btn-copy" onclick="copyOutput()">📋 Copy Output</button>
<button class="btn-clear" onclick="clearAll()">🗑 Clear</button>
</div>
<div id="output"></div>
<script>
function run() {
    const code = document.getElementById('code').value;
    if (!code.trim()) { document.getElementById('output').textContent = 'Please enter some code.'; return; }
    document.getElementById('output').textContent = 'Running...';
    fetch('/api/execute/code', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,mode:'all',language:'python'})})
        .then(r => r.json())
        .then(d => {
            let out = `Status: ${d.status}\nOutput: ${d.stdout || 'none'}\nIterations: ${d.iterations}`;
            if (d.fixes_applied?.length) {
                out += '\n\nFixes:';
                d.fixes_applied.forEach(f => out += `\n  #${f.attempt}: ${f.fix}`);
            }
            if (d.metrics) {
                out += `\n\nMetrics: score=${d.metrics.score || 'N/A'}, complexity=${d.metrics.complexity}, error_handling=${d.metrics.has_error_handling}`;
            }
            document.getElementById('output').textContent = out;
        })
        .catch(e => document.getElementById('output').textContent = 'Error: ' + e.message);
}
function copyCode() { navigator.clipboard.writeText(document.getElementById('code').value); }
function copyOutput() { const o = document.getElementById('output').textContent; navigator.clipboard.writeText(o || ''); }
function clearAll() { document.getElementById('code').value = ''; document.getElementById('output').textContent = ''; }
</script>
</body>
</html>
