<!DOCTYPE html>
<html>
<head>
    <title>Trials — SKV Network v4.5</title>
    <style>
        body { font-family: system-ui; background: #0d1117; color: #c9d1d9; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #f0883e; }
        .cube { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px; margin: 10px 0; }
        .down { color: #f85149; }
        .up { color: #7ee787; }
        button { padding: 6px 12px; margin: 4px; border-radius: 4px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; cursor: pointer; }
    </style>
</head>
<body>
    <div class="nav" style="display:flex;gap:24px;padding:16px 24px;border-bottom:1px solid #21262d;margin-bottom:20px">
        <a href="/" style="color:#8b949e;text-decoration:none">Home</a>
        <a href="/upload" style="color:#8b949e;text-decoration:none">Upload</a>
        <a href="/trials" style="color:#f78166;text-decoration:none;font-weight:bold">Trials</a>
        <a href="/evolver" style="color:#8b949e;text-decoration:none">Evolver</a>
        <a href="/guide" style="color:#8b949e;text-decoration:none">Guide</a>
        <a href="/about" style="color:#8b949e;text-decoration:none">About</a>
    </div>
    <h1>⚖️ Trials — Community Quality Control</h1>
    <p>Cubes with 3+ downvotes are flagged for review.</p>
    <div id="trials">Loading...</div>
    
    <script>
        async function loadTrials() {
            const r = await fetch('/api/v4/trials/pending');
            const data = await r.json();
            const div = document.getElementById('trials');
            
            if (data.pending_trials.length === 0) {
                div.innerHTML = '<p style="color:#7ee787">✅ No pending trials — all cubes are healthy!</p>';
                return;
            }
            
            div.innerHTML = data.pending_trials.map(t => `
                <div class="cube">
                    <b>${t.cube_id}</b>
                    <span class="down">▼ ${t.down_count} downvotes</span>
                    <br>
                    <button onclick="vote('${t.cube_id}','up')">👍 Keep</button>
                    <button onclick="vote('${t.cube_id}','down')">👎 Remove</button>
                </div>
            `).join('');
        }
        
        async function vote(cubeId, v) {
            await fetch('/api/v4/trials/vote', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cube_id: cubeId, user_id: 'voter_' + Date.now(), vote: v, comment: 'Reviewed via web'})
            });
            loadTrials();
        }
        
        loadTrials();
    </script>
</body>
</html>
